[config]
schemaVersion = "1.0.0"

[package]
namespace = "Binbin"
name = "Chaotic_Corruptions"
versionNumber = "1.1.0"
description = "Provides configs to Randomize or Corrupt starter cards and items."
websiteUrl = "https://github.com/binbinmods/ChaoticCorruptions"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_AcrossTheObelisk = "5.4.23"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./ChaoticCorruptions"
target = ""


[publish]
repository = "https://thunderstore.io"
communities = [ "across-the-obelisk", ]
[publish.categories]
across-the-obelisk = [ "mods", ]
